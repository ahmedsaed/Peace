name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same PR makes the previous run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Runs in about a minute and catches most of what breaks, so it
  # is deliberately separate from the slow native build below.
  check:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

  # The APK. Much slower (prebuild + Gradle + C++), so it does not gate the
  # quick checks above.
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # android/ is gitignored — it is generated from app.json and the config
      # plugins, so CI has to produce it rather than check it out.
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install

      # Secrets are unavailable to pull requests from forks. The signing plugin
      # falls back to the debug keystore in that case, so the build still
      # produces an installable (if not upgrade-compatible) APK.
      - name: Decode signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.PEACE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/peace-release.jks"
          echo "PEACE_STORE_FILE=$RUNNER_TEMP/peace-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_PEACE_STORE_FILE: ${{ env.PEACE_STORE_FILE }}
          ORG_GRADLE_PROJECT_PEACE_STORE_PASSWORD: ${{ secrets.PEACE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PEACE_KEY_ALIAS: ${{ secrets.PEACE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PEACE_KEY_PASSWORD: ${{ secrets.PEACE_KEY_PASSWORD }}
        working-directory: android
        # arm64 only: it covers every phone since ~2017 and roughly quarters the
        # C++ compile time versus building all four ABIs.
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a

      - name: Report what signed it
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
            | grep -E "Signer #1 certificate DN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: peace-${{ github.event.pull_request.number || github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
