name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same PR makes the previous run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Runs in about a minute and catches most of what breaks, so it
  # is deliberately separate from the slow native build below.
  check:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # From .nvmrc, so CI uses the same npm as local development. npm 10
          # and 11 record optional platform dependencies differently, and the
          # mismatch makes `npm ci` reject a lockfile that is perfectly valid.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

  # The APK. Much slower (prebuild + Gradle + C++), so it does not gate the
  # quick checks above. Same reusable workflow the release uses, so what gets
  # reviewed on a PR is built by the same steps as what gets published.
  apk:
    needs: check
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
