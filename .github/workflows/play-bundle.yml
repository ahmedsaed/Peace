name: Play bundle

# The AAB for the Play Console, built on request.
#
# MANUAL ON PURPOSE. Every merge publishes a GitHub release, and that is fine
# because a release is free to ignore; an upload to Play is not — it takes a
# review, burns a versionCode for good, and goes to testers' phones. So the
# bundle is built when somebody means to upload one, from whatever ref they
# choose, and handed back as an artifact to upload in Play Console.
#
# Same reusable build as the PR and the release (see build-apk.yml): the play
# flavor changes the application id and the output format and nothing else.
#
# UPLOADING. With a track chosen, the bundle goes straight to Play — as a DRAFT
# by default, so nothing reaches a tester until somebody presses "Roll out" in
# Play Console. With `internal` (on by default) the same build is also RELEASED
# to internal testing at once: that list is the owner and whoever they trust,
# and it is how a build gets onto a real phone before the closed testers see it. There is no key anywhere: Workload Identity Federation lets a
# run of THIS workflow, in this repo, on main, borrow the `peace-play-upload`
# service account for an hour (the two `PLAY_*` repository variables say which
# provider and account). That account holds "Release to testing tracks" for
# this app and nothing else, so production is unreachable from here by design —
# promoting a build to production stays a human's click in Play Console.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Upload to this Play track (alpha is closed testing). "none" only builds.
        type: choice
        options: [alpha, internal, none]
        default: alpha
      status:
        description: draft waits for "Roll out" in Play Console; completed releases at once.
        type: choice
        options: [draft, completed]
        default: draft
      internal:
        description: Also release the same build to internal testing at once (not a draft).
        type: boolean
        default: true
      notes:
        description: Release notes (en-US). Empty takes this version's entry in src/constants/whats-new.json.
        type: string
        required: false

jobs:
  bundle:
    uses: ./.github/workflows/build-apk.yml
    with:
      flavor: play
    secrets: inherit

  summary:
    name: Upload instructions
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Say what was built
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
          BUILD: ${{ needs.bundle.outputs.build-number }}
        run: |
          {
            echo "## Peace $VERSION (build $BUILD) — Play bundle"
            echo
            echo "Download the \`peace-play-…\` artifact below, unzip it, and upload the \`.aab\` in"
            echo "Play Console › Test and release › (track) › Create new release."
            echo
            echo "versionCode **$BUILD** is used up the moment Play accepts it; the next upload"
            echo "must come from a later commit."
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload to Play (${{ inputs.track }}, ${{ inputs.status }}${{ inputs.internal && inputs.track != 'internal' && ' + internal' || '' }})
    needs: bundle
    if: inputs.track != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets GitHub vouch for this run to Google. No secret is involved.
      id-token: write
    steps:
      # Only the release notes: the in-app What's new list is also what Play
      # shows, so the two never say different things.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/constants/whats-new.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # The Publishing API, spoken directly: open an edit, upload the bundle
      # into it, put that versionCode on the track, commit. Four calls, no
      # third-party action holding the token.
      - name: Upload the bundle
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          INTERNAL: ${{ inputs.internal }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.bundle.outputs.version }}
          BUILD: ${{ needs.bundle.outputs.build-number }}
        run: |
          set -euo pipefail
          PKG=dev.merope.peace
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG"
          AUTH=(-H "Authorization: Bearer $TOKEN")
          # Every call prints Play's own error on failure: its message names
          # the actual problem (a missing permission, a used versionCode),
          # where a bare HTTP status would not.
          call() {
            local out
            if ! out=$(curl -sS --fail-with-body "${AUTH[@]}" "$@"); then
              echo "::error::Play API call failed: $out" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          if [ -z "$NOTES" ]; then
            NOTES=$(jq -r --arg v "$VERSION" '.[] | select(.version == $v) | .notes | map("• " + .) | join("\n")' src/constants/whats-new.json)
          fi
          echo "release notes: ${NOTES:-(none)}"

          AAB=$(find . -maxdepth 2 -name '*.aab' -print -quit)
          [ -n "$AAB" ] || { echo "::error::No .aab in the downloaded artifacts."; exit 1; }
          echo "uploading $AAB"

          EDIT=$(call -X POST "$API/edits" | jq -r .id)

          UPLOADED=$(call -X POST \
            -H "Content-Type: application/octet-stream" --data-binary @"$AAB" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PKG/edits/$EDIT/bundles?uploadType=media" \
            | jq -r .versionCode)
          # The number Play recorded must be the build we think we uploaded.
          [ "$UPLOADED" = "$BUILD" ] || { echo "::error::Play recorded versionCode $UPLOADED, expected $BUILD."; exit 1; }

          # One versionCode can sit on several tracks. Internal testing gets it
          # RELEASED, so the people closest to the app have it within minutes;
          # the chosen track gets it as asked (a draft by default). Both in ONE
          # edit, so either both land or neither does.
          put_track() {
            local track=$1 status=$2 release
            release=$(jq -n --arg name "$VERSION ($BUILD)" --arg code "$BUILD" --arg status "$status" --arg notes "$NOTES" '
              {name: $name, versionCodes: [$code], status: $status}
              + (if $notes == "" then {} else {releaseNotes: [{language: "en-US", text: $notes}]} end)')
            jq -n --arg track "$track" --argjson release "$release" '{track: $track, releases: [$release]}' > track.json
            call -X PUT -H "Content-Type: application/json" \
              --data @track.json "$API/edits/$EDIT/tracks/$track" > /dev/null
            echo "$track: $status"
          }
          put_track "$TRACK" "$STATUS"
          ALSO_INTERNAL=false
          if [ "$INTERNAL" = true ] && [ "$TRACK" != internal ]; then
            put_track internal completed
            ALSO_INTERNAL=true
          fi

          # Some changes cannot be sent for review by the API (Play says so in
          # the error); those are committed as pending and sent from the
          # Publishing overview by hand.
          if ! OUT=$(call -X POST "$API/edits/$EDIT:commit" 2>&1); then
            echo "$OUT" >&2
            echo "$OUT" | grep -q changesNotSentForReview || exit 1
            call -X POST "$API/edits/$EDIT:commit?changesNotSentForReview=true" > /dev/null
            echo "::notice::Committed, but not sent for review — send it from Play Console › Publishing overview."
          fi

          {
            echo "## Uploaded to Play: $VERSION (build $BUILD)"
            echo
            echo "Track **$TRACK**, status **$STATUS**."
            [ "$STATUS" = draft ] && echo "Open Play Console › Test and release › $TRACK and press **Roll out** when ready." || true
            [ "$ALSO_INTERNAL" = true ] && echo "Also **released** to internal testing." || true
          } >> "$GITHUB_STEP_SUMMARY"
