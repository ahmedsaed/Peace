appId: com.ahmed.peace
---
# Creating an account and a category, and the guard that stops an account being
# deleted out from under its history.
- launchApp:
    clearState: true

# `clearState` wipes the dev build's cached JS too, so a cold launch re-fetches
# the whole bundle from Metro *and* then runs migrations and seeding. That is
# comfortably longer than Maestro's default assertion wait, and it fails looking
# like a broken screen rather than a slow one. Gate on the first screen instead
# of racing it — this still fails if the app never renders.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- create an account ---
- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-screen"
- tapOn:
    id: "fab-account"
- assertVisible: "New account"

- tapOn:
    id: "account-name"
- inputText: "Savings"
- tapOn:
    id: "acct-type-savings"
- tapOn:
    id: "form-save"

- assertVisible:
    id: "accounts-screen"
- assertVisible: "Savings"
- takeScreenshot: 01-account-created

# --- create a category ---
- tapOn:
    id: "tab-categories"
- tapOn:
    id: "fab-category"
- assertVisible: "New category"

- tapOn:
    id: "category-name"
- inputText: "Gym"
- tapOn:
    id: "form-save"

- assertVisible:
    id: "categories-screen"
- scrollUntilVisible:
    element: "Gym"
    direction: DOWN
- takeScreenshot: 02-category-created

# --- the account delete guard ---
# Log something against Cash, then try to delete Cash. Deleting cascades to
# transactions, so the repository refuses — and the refusal is a DESTINATION,
# not a sentence: the row carries the count and goes to the records in the way.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "key-9"
- tapOn:
    id: "record-save"
- assertVisible: "-E£9.00"

- tapOn:
    id: "tab-accounts"
# HOLD, not tap. Delete used to live at the foot of the edit form, below an
# icon grid that grew every time a glyph was added — so this flow had to scroll
# to find a button that was rendering perfectly. Nothing to scroll past now.
- longPressOn: "Cash"
- assertVisible:
    id: "entity-actions"
- assertVisible:
    id: "entity-delete-blocked"
# Maestro matches text as a regex anchored to the WHOLE element, so a substring
# needs explicit wildcards.
- assertVisible: ".*1 record must move first.*"
- takeScreenshot: 03-delete-guarded

# THE ASSERTION THAT MATTERS: the count is not just printed, it is a way to the
# records it counted. This is what a user could never reach before — the list
# existed only behind a count chip in Settings, after archiving the account.
- tapOn:
    id: "entity-delete-blocked"
- assertVisible:
    id: "search-screen"
- assertVisible:
    id: "search-count"
    text: "1 record"
- takeScreenshot: 04-blocked-shows-the-records
- tapOn:
    id: "nav-back"
