appId: com.ahmed.peace
---
# Putting things away, and getting them back — from the list it left.
#
# Archiving used to be a one-way door dressed as five different controls: a
# switch in an editor, a dimmed group on one tab, nothing at all on another,
# three count rows in Settings opening a modal, and an inline button in the tag
# picker. The way back lived in Settings, which is precisely where the thing
# ISN'T. Now every list carries its own archive at its foot and one sheet does
# the work everywhere, so this flow's job is to prove the round trip happens
# entirely within the list the thing belongs to.
#
# Tags are the same story on their own screen; that half lives in tags.yaml.
- launchApp:
    clearState: true

# Gate on the first screen rather than racing migrations and seeding — see
# manage.yaml for why this is an extendedWaitUntil and not an assertion.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- put money in Cash, so the total has something to be wrong about ---
# Cash is the first seeded account, so a record with no account chosen lands
# on it. E£9.00 out of it is the figure every assertion below watches.
- tapOn:
    id: "fab"
- tapOn:
    id: "key-9"
- tapOn:
    id: "record-save"

- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-screen"
- assertVisible:
    id: "accounts-total"
    text: "-E£9.00"
- assertVisible: "Cash"

# ===========================================================================
# What a long press offers, and what it refuses
# ===========================================================================
- longPressOn: "Cash"
- assertVisible:
    id: "entity-actions"
# The balance is on the sheet, so the thing being acted on is named by more
# than a word that might match two accounts.
- assertVisible:
    id: "entity-detail"
- takeScreenshot: 01-account-actions

# DELETE IS A DESTINATION, NOT A SENTENCE. Cash carries the E£9.00 record, so
# the row counts what is in the way and going through it lands on exactly those
# records. A dead "you cannot delete this" is how people learn to stop pressing
# things.
- assertVisible:
    id: "entity-delete-blocked"
- tapOn:
    id: "entity-delete-blocked"
- assertVisible:
    id: "search-screen"
# The count on the row and the list that opens come from ONE query, so this is
# the same "1" the sheet counted with.
- assertVisible:
    id: "search-count"
    text: "1 record"
- takeScreenshot: 02-blocked-by-records
- tapOn:
    id: "nav-back"

# --- its records, without having to be refused first ---
# The action the app never had: the filtered list existed only as the
# consequence of a blocked delete, so "what is actually on this account" had no
# answer anywhere in the UI.
- assertVisible:
    id: "accounts-screen"
- longPressOn: "Cash"
- tapOn:
    id: "entity-show-records"
- assertVisible:
    id: "search-screen"
- assertVisible:
    id: "search-count"
    text: "1 record"
- tapOn:
    id: "nav-back"

# ===========================================================================
# Put it away, from the list
# ===========================================================================
- longPressOn: "Cash"
- tapOn:
    id: "entity-archive"
- assertVisible:
    id: "accounts-notice"

# THE TOTAL DOES NOT MOVE. Money in an archived account has not been spent —
# a wallet in a drawer is still yours. This used to fall to E£0.00 here while
# the home screen's "Now" went on saying -E£9.00, two screens disagreeing by
# exactly the archived balance with nothing on either to explain it.
- assertVisible:
    id: "accounts-total"
    text: "-E£9.00"
# ...and the list accounts for that money without showing the row: the group is
# SHUT, and its header carries the balance. A figure that includes money the
# screen never mentions is a screen disagreeing with itself.
- assertVisible:
    id: "accounts-archived"
- assertVisible:
    id: "accounts-archived-count"
    text: "1"
- assertVisible:
    id: "accounts-archived-summary"
    text: "-E£9.00"
- takeScreenshot: 03-account-archived

# Off the pickers, which is what archiving is actually for.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-account"
- assertVisible:
    id: "sheet-account"
- assertNotVisible: "Cash"
- tapOn:
    id: "picker-close"
- tapOn:
    id: "record-cancel"

# ===========================================================================
# ...and bring it back, from the same list
# ===========================================================================
- tapOn:
    id: "tab-accounts"
# Shut by default — the point of archiving is that it stops being in the way —
# so the row has to be asked for before it can be held.
- tapOn:
    id: "accounts-archived-toggle"
- assertVisible:
    id: "accounts-archived-items"
- longPressOn: "Cash"
# The sheet says what state the thing is in, so the action makes sense on its
# own rather than depending on which group the row was dragged from.
- assertVisible:
    id: "entity-archived-chip"
- tapOn:
    id: "entity-restore"
- assertVisible:
    id: "accounts-notice"

# THE ASSERTION THAT MATTERS. The account is back in the list proper, the
# archived group is gone entirely, and the picker offers it again — which is
# the thing archiving actually took away.
- assertNotVisible:
    id: "accounts-archived"
- assertVisible:
    id: "accounts-total"
    text: "-E£9.00"
- takeScreenshot: 04-account-restored

- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-account"
- assertVisible:
    id: "sheet-account"
- assertVisible: "Cash"
- tapOn:
    id: "picker-close"
- tapOn:
    id: "record-cancel"

# ===========================================================================
# The same round trip for a category
# ===========================================================================
# This tab had NO archived surface at all: a category put away simply vanished
# from it, and the only way back was a screen in the menu.
- tapOn:
    id: "tab-categories"
- assertVisible:
    id: "categories-screen"
- scrollUntilVisible:
    element: "Pets"
    direction: DOWN
- longPressOn: "Pets"
- assertVisible:
    id: "entity-actions"
- tapOn:
    id: "entity-archive"
- assertVisible:
    id: "categories-notice"
- takeScreenshot: 05-category-archived

# Gone from its own list, and accounted for at the foot of it. The categories
# list is long — two sections and ~30 rows — so the group has to be scrolled to
# rather than asserted blind.
- scrollUntilVisible:
    element:
      id: "categories-archived"
    direction: DOWN
- assertVisible:
    id: "categories-archived-count"
    text: "1"

# ...and back from the foot of that same list.
- tapOn:
    id: "categories-archived-toggle"
- assertVisible:
    id: "categories-archived-items"
- longPressOn: "Pets"
- tapOn:
    id: "entity-restore"
- assertVisible:
    id: "categories-notice"
- assertNotVisible:
    id: "categories-archived"
# `scrollUntilVisible` fails the flow if it is not there, which
# `assertNotVisible` on a long scrolling list could never prove in the other
# direction.
- scrollUntilVisible:
    element: "Pets"
    direction: DOWN
- takeScreenshot: 06-category-restored

# ===========================================================================
# Deleting one that nothing points at
# ===========================================================================
# Baby has no records, so its delete is free rather than blocked — and it still
# takes a second tap that names what is about to go, because this is the one
# action here that cannot be undone.
- scrollUntilVisible:
    element: "Baby"
    direction: DOWN
- longPressOn: "Baby"
- assertVisible:
    id: "entity-actions"
- assertVisible:
    id: "entity-delete"
- tapOn:
    id: "entity-delete"
# Armed, not done.
- assertVisible: "Delete Baby for good?"
- takeScreenshot: 07-delete-armed
# The way out of the confirmation, which must not delete anything.
- tapOn:
    id: "entity-cancel"
- assertVisible:
    id: "entity-delete"
- tapOn:
    id: "entity-delete"
- tapOn:
    id: "entity-confirm"
- assertVisible:
    id: "categories-notice"

# Gone from the list, and no archive left behind: deleting is not archiving.
- assertVisible:
    id: "categories-screen"
- assertNotVisible: "Baby"
- assertNotVisible:
    id: "categories-archived"
- takeScreenshot: 08-category-deleted

# ===========================================================================
# A category with records cannot be deleted at all
# ===========================================================================
# THE BUG THIS REPLACES: the editor's "Delete category" went ahead and left
# every record on it reading "Uncategorised" — the money survived and what it
# was spent on did not — while Settings refused the very same delete. One
# entity, one word, two opposite behaviours, and the lossy one was the only one
# a user would ever find.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "key-5"
- tapOn:
    id: "pick-category"
- tapOn: "Groceries"
- tapOn:
    id: "record-save"

- tapOn:
    id: "tab-categories"
# Held on the PARENT, whose own records are none: a parent is answerable for
# its children's too, or the count that refuses would disagree with the list
# that opens.
# UP: the list is still where the delete left it, near the foot, and Food sits
# near the head of the expense section.
- scrollUntilVisible:
    element: "Food"
    direction: UP
- longPressOn: "Food"
- assertVisible:
    id: "entity-delete-blocked"
- assertVisible: ".*1 record must move first.*"
- tapOn:
    id: "entity-delete-blocked"
- assertVisible:
    id: "search-screen"
- assertVisible:
    id: "search-count"
    text: "1 record"
- takeScreenshot: 09-category-delete-blocked
