appId: com.ahmed.peace
# `core` runs on `npm run e2e:fast` — the chrome every screen hangs off.
tags:
  - core
---
# The side menu and the search entry point.
#
# Asserts values a person would actually check — the version string, the
# package name — rather than "a screen appeared". A flow that only asserts
# visibility of a title would still pass if every destination rendered blank.
- launchApp:
    clearState: true

# `clearState` wipes the dev build's cached JS too, so a cold launch re-fetches
# the whole bundle from Metro *and* then runs migrations and seeding. That is
# comfortably longer than Maestro's default assertion wait, and it fails looking
# like a broken screen rather than a slow one. Gate on the first screen instead
# of racing it — this still fails if the app never renders.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- header chrome is present on the tab screens ---
- assertVisible:
    id: "nav-menu"
- assertVisible:
    id: "nav-search"

# --- the drawer opens from the hamburger and lists its destinations ---
- tapOn:
    id: "nav-menu"
- assertVisible: "Settings"
- assertVisible: "Export & backup"
- assertVisible: "About"
# The tagline is a CLAIM, and it has to match what the app does. Disconnected,
# nothing does leave the phone; connecting Drive changes the sentence, because
# copy that contradicts the screen it sits on is worse than copy saying less.
- assertVisible: "Local-first. Nothing leaves the phone."
# No backup card before Drive is set up — a card reading "never backed up" to
# someone who never asked for backups is nagging, not information.
- assertNotVisible:
    id: "drawer-backup-card"
- takeScreenshot: 01-drawer

# --- About is a real screen, so assert what it reports ---
- tapOn:
    id: "drawer-about"
- assertVisible:
    id: "about-screen"
# Patterns, not literals: the build number changes with every commit and the
# sha with every build, so pinning them would mean editing this flow on each
# push — which is how an assertion stops being read and starts being updated on
# autopilot. The shape is what matters, and it still fails if app.config.js
# stops feeding the values through (they fall back to "0.0.0" and "unknown").
- assertVisible:
    id: "about-version"
    text: "[0-9]+\\.[0-9]+\\.[0-9]+ \\(build [0-9]+\\)"
- assertVisible:
    id: "about-commit"
    text: "[0-9a-f]{7}(-dirty)?"
- assertVisible:
    id: "about-package"
    text: "com.ahmed.peace"

# The custom back button returns to the tabs, not to the drawer.
- tapOn:
    id: "nav-back"
- assertVisible:
    id: "app-title"

# --- Export is reachable from the drawer and is a real screen ---
# It used to assert ".*Stage 2.*", the placeholder's own admission that it did
# nothing. That assertion failing is what a placeholder becoming real looks
# like, and the replacement has to be something only the working screen shows —
# the ledger count. The export flow covers the files themselves.
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-export"
- assertVisible:
    id: "export-screen"
- assertVisible:
    id: "export-count"
    text: "[0-9]+ records? in the ledger."
- tapOn:
    id: "nav-back"

# --- search opens from the header ---
# It used to assert "Search is not wired up yet", the placeholder's own
# admission that it did nothing. What replaces it has to be something only the
# working screen shows — the filter panel. The search flow covers the queries.
- tapOn:
    id: "nav-search"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-filters"
- assertVisible:
    id: "search-filter-panel"
- assertVisible:
    id: "filter-kind-expense"
- tapOn:
    id: "nav-back"
- assertVisible:
    id: "home-screen"
