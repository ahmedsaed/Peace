appId: com.ahmed.peace
---
# Putting an account away, and getting it back.
#
# Archiving was a one-way door: the toggle that undoes it lives in the account
# editor, and the only route into that editor is tapping the account in a list
# that hides archived ones. So the point of this flow is NOT that a settings
# row renders — it is that an account which has VANISHED from the Accounts tab
# can be brought back from Settings and is on the Accounts tab again
# afterwards. Asserting only that the sheet listed it would pass just as well
# if the restore wrote nothing.
- launchApp:
    clearState: true

# Gate on the first screen rather than racing migrations and seeding — see
# manage.yaml for why this is an extendedWaitUntil and not an assertion.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- Cash starts out an ordinary account ---
- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-screen"
- assertVisible: "Cash"

# --- put it away ---
- tapOn: "Cash"
- assertVisible: "Edit account"
# The toggle sits below the icon grid, which grows as glyphs are added — the
# same scroll every other flow that reaches the foot of this form needs.
- scrollUntilVisible:
    element:
      id: "account-archived"
    direction: DOWN
- tapOn:
    id: "account-archived"
- assertVisible: "Hidden from pickers"
- tapOn:
    id: "form-save"

# Gone from the list, which is exactly what left no way back.
- assertVisible:
    id: "accounts-screen"
- assertNotVisible: "Cash"
- takeScreenshot: 01-account-archived

# --- find it in Settings ---
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible:
    id: "setting-archived-accounts"
# The row counts what is waiting, so an empty archive and a broken query do not
# look the same from here.
- assertVisible: "1 put away"

- tapOn:
    id: "setting-archived-accounts"
- assertVisible:
    id: "sheet-archived-accounts"
- assertVisible: "Cash"
- takeScreenshot: 02-archived-listed

# --- bring it back ---
- tapOn: "Cash"
- assertVisible:
    id: "account-restored"
# Nothing is put away any more, so the row has nowhere to go and says so.
- assertVisible: "None"
- takeScreenshot: 03-account-restored

# THE ASSERTION THAT MATTERS. On a different screen, the account is listed
# again — and it is offered by the record screen's account picker, which is the
# thing archiving actually took away.
- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-screen"
- assertVisible: "Cash"

- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-account"
- assertVisible:
    id: "sheet-account"
- assertVisible: "Cash"
- takeScreenshot: 04-back-in-the-picker
