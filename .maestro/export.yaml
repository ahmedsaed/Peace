appId: com.ahmed.peace
---
# Export and backup, end to end.
#
# The share sheet is system UI and its contents vary by device, so this does not
# try to drive it. What it does assert is the part that can silently fail: that
# a file was actually written, and named. `export-done` only appears after the
# file exists on disk and the share sheet has been handed its uri — so a
# filename appearing here means the whole chain ran.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# One record, so the export is not empty. An export of nothing would pass every
# assertion below while proving nothing about the query.
- tapOn:
    id: "fab"
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-export"
- assertVisible:
    id: "export-screen"
- assertVisible:
    id: "export-count"
    text: "1 record in the ledger."

# --- CSV ---
- tapOn:
    id: "export-csv-share"
# The share sheet is a separate window. Its CONTENTS are not asserted — they
# differ by device and by mime type, and an earlier version of this flow waited
# for the app name, which the chooser shows for a .csv but not for a .db.
# Dismissing it resolves shareAsync, which is what renders the result.
#
# THE SIZE IS PART OF THE ASSERTION. An earlier version checked only the
# filename, and passed while the backup was 0 bytes — `copy()` is async and was
# being called synchronously, so the share sheet offered an empty file under a
# perfectly correct name. Asserting a non-zero size is what makes this flow
# mean "a backup exists" rather than "a backup was named".
- waitForAnimationToEnd:
    timeout: 8000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "export-done"
      text: "peace-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.csv · [0-9]+ (B|KB|MB) sent"
    timeout: 15000
- takeScreenshot: 01-export

# --- full backup ---
# The WAL checkpoint runs here. If it ever throws, this is what catches it —
# the screen would show export-error instead of a filename.
#
# `.zip` since a backup became a CONTAINER of the database plus the receipt
# files it refers to. The size assertion carries more weight than it looks:
# zipping is where a backup could newly come out empty, and `[0-9]+ KB` fails
# on the 0-byte case that once shipped.
- tapOn:
    id: "export-backup-share"
- waitForAnimationToEnd:
    timeout: 8000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "export-done"
      text: "peace-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.zip · [0-9]+ (B|KB|MB) sent"
    timeout: 15000
- assertNotVisible:
    id: "export-error"

# NOT COVERED HERE: restore.
#
# It goes through the system file picker, whose layout differs by device and
# Android version, so a flow driving it would assert the picker's UI rather
# than the app's. The part that matters is covered where it can be tested
# properly: src/db/restore-core.test.ts destroys a real database and gets it
# back, refuses a foreign file, refuses a newer backup, and proves a failure
# part-way through rolls back completely.
#
# The whole round trip — record, back up, wipe with `pm clear`, restore, undo —
# was verified by hand on a release build.

# --- Google Drive: the part a flow can honestly assert ---
#
# NOT the sign-in. Driving a real Google consent screen needs a Google account
# on the device, a live network and a real grant — non-hermetic and flaky, and
# it would be asserting Google's UI rather than this app's. What IS testable is
# that the section renders, offers the right thing, and explains itself; the
# logic behind the button is covered by unit tests (google-auth, drive-api,
# seal, drive) and by hand on a release build.
- scrollUntilVisible:
    element:
      id: "drive-section"
    direction: DOWN
- assertVisible:
    id: "drive-connect"
# The promise the user is being asked to accept. If this copy ever stops
# matching what the code does — a visible folder, or an unencrypted upload
# described as private — that is a lie in the one place it matters most.
- assertVisible: ".*private folder only Peace can see.*"
- takeScreenshot: 04-drive-disconnected

# Before connecting there is nothing to report, so none of the connected
# controls may be on screen. A section that showed "Back up now" while
# disconnected would fail on the first tap with an auth error the user could
# not act on.
- assertNotVisible:
    id: "drive-backup-now"
- assertNotVisible:
    id: "drive-check"
- assertNotVisible:
    id: "drive-cadence-weekly"
