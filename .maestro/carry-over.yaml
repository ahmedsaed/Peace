appId: com.ahmed.peace
---
# Carry-over: what each month started with, and the running total.
#
# NOT budget carry-over. A limit that grows when you fail to use it is not a
# limit — this reports a running cash position and leaves every budget alone.
#
# The assertion that matters is the RECONCILIATION: brought forward plus the
# month's balance has to equal what the Accounts screen says you hold. If those
# two disagree, one screen is lying and the user cannot tell which.
#
# Records are logged TODAY and the flow then steps forward a month, rather than
# back-dating anything. Driving the native date dialog to a specific day is
# fragile, and "this month's net is next month's opening" exercises exactly the
# same query.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- carry-over is on by default, so the third cell is the position ---
# The testID moves with the label. `summary-balance` and `summary-running` are
# two different numbers, and one id covering both would make every assertion
# below ambiguous about which it had read.
- assertVisible:
    id: "summary-running"
- assertNotVisible:
    id: "summary-balance"

# --- earn 9,000, spend 2,000 ---
- tapOn:
    id: "fab"
- tapOn:
    id: "type-income"
- tapOn:
    id: "pick-category"
- tapOn: "Salary"
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- tapOn: "Coffee"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# Nothing came before this month, so the position is exactly the month's net.
# This fails if the carry query stops respecting the month boundary and starts
# counting the records inside the month it is opening — that would double the
# 7,000.
- assertVisible:
    id: "summary-running"
    text: "E£7,000.00"
- takeScreenshot: 01-carry-this-month

# --- WHERE THAT 7,000 CAME FROM ---
# The cell is one number standing in for opening balances, every earlier month
# and every account at once. The sheet is a TABLE — accounts down, time across —
# because the question is not "where is my money" (the Accounts screen) and not
# "what did this month do" (the two cells to the left) but both at once: is the
# figure high because the month went well, or because an account has been
# sitting on money since March?
- tapOn:
    id: "summary-explain"
- assertVisible:
    id: "position-sheet"
- assertVisible:
    id: "position-total"
    text: "E£7,000.00"

# Both seeded accounts are listed, Bank included at zero — an ACTIVE account at
# nothing is an answer, and a list whose rows come and go with the data is one
# you cannot scan.
- assertVisible:
    id: "position-account-seed:acct:cash"
- assertVisible:
    id: "position-account-seed:acct:bank"

# THE COLUMN TOTALS. Nothing came before this month, so the history column is
# empty and the whole figure is what September did — which is precisely the
# reading the table exists to make possible.
- assertVisible:
    id: "position-carry"
    text: "E£0.00"
- assertVisible:
    id: "position-month"
    text: "E£7,000.00"
- assertVisible:
    id: "position-accounts-total"
    text: "E£7,000.00"

# ...and what the month column is made of, signed, because these are being
# added up in front of the user.
- assertVisible:
    id: "position-income"
    text: "E£9,000.00"
- assertVisible:
    id: "position-expense"
    text: "-E£2,000.00"
- assertVisible:
    id: "position-month-total"
    text: "E£7,000.00"
- takeScreenshot: 01b-position-breakdown

- tapOn:
    id: "position-close"
- assertNotVisible:
    id: "position-sheet"

- tapOn:
    id: "month-next"
# The month itself is empty, so this 7,000 is ENTIRELY what was carried in —
# income and expense both read zero beside it.
- assertVisible:
    id: "summary-running"
    text: "E£7,000.00"
- assertVisible:
    id: "summary-expense"
    text: "E£0.00"
- assertVisible:
    id: "summary-income"
    text: "E£0.00"
- takeScreenshot: 02-carry-next-month

# --- AND THE TABLE SAYS WHY IT IS 7,000 IN A MONTH THAT DID NOTHING ---
# THE READING THE FEATURE EXISTS FOR. The figure is unchanged from last month
# while income and expense both read zero beside it, and the only way to tell
# those two facts apart is the split: everything is in the history column and
# nothing in October's. Without it the number looks like a month that earned
# 7,000.
- tapOn:
    id: "summary-explain"
- assertVisible:
    id: "position-carry"
    text: "E£7,000.00"
- assertVisible:
    id: "position-month"
    text: "E£0.00"
- assertVisible:
    id: "position-accounts-total"
    text: "E£7,000.00"
- takeScreenshot: 02b-position-carried-in
- tapOn:
    id: "position-close"

# --- THE RECONCILIATION: the two screens must agree ---
- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-total"
    text: "E£7,000.00"

# --- a budget is NOT touched by any of this ---
# The whole design decision in one assertion: 2,000 spent against a 2,000 limit
# is 100%, and next month's limit is the limit that was set, not the limit plus
# whatever went unspent.
# No month navigation here: each tab keeps its OWN period state, so Budgets
# opens on the current month regardless of where Records was left. Stepping back
# would land on an empty month and set a limit against no spending at all.
- tapOn:
    id: "tab-budgets"
- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-food"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-food"
- inputText: "2000"
- tapOn:
    id: "budget-save"
- assertVisible:
    id: "budget-percent-seed-cat-food"
    text: "100%"

# --- turn it off, and the position line goes ---
# A setting that nothing reads must not be shown; the other half of that rule is
# that the switch has to move a number on a DIFFERENT screen.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- assertVisible:
    id: "setting-carry-over"
- tapOn:
    id: "setting-carry-over"
- tapOn:
    id: "nav-back"
# No month-next here: the Records tab kept September while we were away, and
# stepping again would drift into October — still passing, but asserting about a
# month the flow never set up.
# With it off the cell goes back to being the month's own net: an empty month
# reads E£0.00 where a moment ago it read the E£7,000 position.
- assertNotVisible:
    id: "summary-running"
- assertVisible:
    id: "summary-balance"
    text: "E£0.00"

# The breakdown follows the cell. With carry-over off the figure is the month's
# own net, so there is nothing carried into it — and the "Brought forward" row
# is GONE rather than showing zero, because a zero row would invent a component
# of a sum that has one fewer.
- tapOn:
    id: "summary-explain"
- assertVisible:
    id: "position-sheet"
- assertNotVisible:
    id: "position-carry"
- assertVisible:
    id: "position-accounts-total"
    text: "E£0.00"
- tapOn:
    id: "position-close"

# --- and back on again ---
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "setting-carry-over"
- tapOn:
    id: "nav-back"
- assertVisible:
    id: "summary-running"
    text: "E£7,000.00"
- assertNotVisible:
    id: "summary-balance"
