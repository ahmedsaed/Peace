appId: dev.merope.peace.oss
---
# The AI features WITHOUT a key — the state every user meets first.
#
# With no key nothing AI can run, so nothing AI may LOOK as if it can: every
# switch is shown off and muted, the receipt-reading button and Penny's way in
# are gone, and each feature's page says why with the way to fix it. What the
# switches do once a key exists is `.maestro/live/ai-switches.yaml` (it needs a
# real key, and costs nothing — saving one only lists models), and a whole
# conversation is `.maestro/live/assistant-live.yaml`.
- launchApp:
    clearState: true
    # Skip the welcome screens and keep the fixture currency (lib/first-run.ts).
    arguments:
      peace.onboarding: done
      peace.currency: EGP

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- no key: no door to Penny anywhere ---
- assertNotVisible:
    id: "nav-assistant"
- tapOn:
    id: "nav-menu"
- assertVisible:
    id: "drawer-settings"
- tapOn:
    id: "drawer-settings"

# --- Settings: Use AI is muted, and every feature says what it needs ---
- scrollUntilVisible:
    element:
      id: "settings-ai-penny"
    direction: DOWN
- assertVisible:
    id: "setting-ai-enabled"
    enabled: false
- assertVisible:
    id: "gemini-key-state"
    text: "Not set"
- assertVisible:
    id: "settings-ai-receipts-summary"
    text: "Needs a key"
- assertVisible:
    id: "settings-ai-penny-summary"
    text: "Needs a key"
- assertVisible:
    id: "settings-ai-voice-summary"
    text: "Needs a key"
- takeScreenshot: 01-ai-no-key

# --- each feature page: the notice, and a switch that cannot claim to be on ---
- tapOn:
    id: "settings-ai-penny"
- assertVisible:
    id: "key-notice"
- assertVisible:
    id: "assistant-enabled"
    enabled: false
# The consent is the switch, so the sentence it consents to is there even
# while it cannot be flipped — and names where the data would go.
- assertVisible:
    id: "assistant-privacy"
- assertVisible: ".*Google.*Gemini.*"
- assertNotVisible:
    id: "assistant-open"
- takeScreenshot: 02-penny-no-key
- tapOn:
    id: "nav-back"

- tapOn:
    id: "settings-ai-receipts"
- assertVisible:
    id: "key-notice"
- assertVisible:
    id: "receipts-enabled"
    enabled: false
# Options belong to a running feature.
- assertNotVisible:
    id: "receipt-guidance"
- tapOn:
    id: "nav-back"

- tapOn:
    id: "settings-ai-bank"
- assertVisible:
    id: "key-notice"
- assertVisible:
    id: "bank-enabled"
    enabled: false
- assertNotVisible:
    id: "bank-sender-input"
- tapOn:
    id: "nav-back"

- tapOn:
    id: "settings-ai-voice"
- assertVisible:
    id: "key-notice"
- assertVisible:
    id: "voice-enabled"
    enabled: false
- assertNotVisible:
    id: "voice-guidance"
- tapOn:
    id: "nav-back"

# --- a made-up key is CHECKED, refused, and not saved ---
# Saving asks Google to list models with the key first. A made-up one is
# refused (or, on a runner with no network, cannot be checked) — either way the
# editor says so, nothing is stored, and everything stays muted.
- scrollUntilVisible:
    element:
      id: "gemini-key-edit"
    direction: UP
- tapOn:
    id: "gemini-key-edit"
- tapOn:
    id: "gemini-key-input"
- inputText: "AIzaSyD-not-a-real-key-0000"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "gemini-key-save"
    direction: DOWN
- tapOn:
    id: "gemini-key-save"
- extendedWaitUntil:
    visible:
      id: "gemini-key-error"
    timeout: 20000
- assertVisible:
    id: "gemini-key-state"
    text: "Not set"
- takeScreenshot: 03-key-refused
- tapOn:
    id: "gemini-key-cancel"
- assertVisible:
    id: "setting-ai-enabled"
    enabled: false
- tapOn:
    id: "nav-back"

# --- no mic on a new record, and the Speak shortcut says what is missing ---
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "fab"
- assertVisible:
    id: "attach-camera"
- assertNotVisible:
    id: "record-voice"
- tapOn:
    id: "record-cancel"
- openLink: "peace://record?voice=1"
- extendedWaitUntil:
    visible:
      id: "record-error"
      text: ".*needs a Gemini key.*"
    timeout: 10000
- assertNotVisible:
    id: "voice-panel"
- takeScreenshot: 04-speak-no-key
- tapOn:
    id: "record-cancel"

# --- reached anyway (a link), Penny's screen says what is missing ---
- openLink: "peace://assistant"
- assertVisible:
    id: "assistant-gate-no-key"
- assertNotVisible:
    id: "assistant-input"
- tapOn:
    id: "assistant-open-settings"
- assertVisible:
    id: "settings-screen"
