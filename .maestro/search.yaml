appId: com.ahmed.peace
---
# Search across the whole ledger: text, filters, and the totals over the matches.
#
# The assertions here are the NUMBERS, not the presence of a list. A search
# screen that returns every record for every query would still show rows, still
# scroll, and still look entirely correct — only the count and the total say
# whether the query did anything.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- three records to search, chosen so the filters have something to separate ---

# 1. E£250 under Coffee, a SUB-category of Food.
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- tapOn: "Coffee"
- tapOn:
    id: "record-note"
- inputText: "Cilantro flat white"
- hideKeyboard
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

# 2. E£80 under Restaurants — a DIFFERENT sub-category of the same parent.
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- tapOn: "Restaurants"
- tapOn:
    id: "record-note"
- inputText: "dinner"
- hideKeyboard
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

# 3. E£9,000 of income, so the type filter has both sides to choose between.
- tapOn:
    id: "fab"
- tapOn:
    id: "type-income"
- tapOn:
    id: "pick-category"
- tapOn: "Salary"
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

# 4. + 5. Two transfers in OPPOSITE directions between the same pair of
# accounts. One of each is what makes the destination filter provable: with a
# single transfer in the ledger, filtering on either end returns it and the
# query could be pointed at the wrong column without anything failing.
#
# Kept under E£100 so the amount filter further down still separates the same
# two records it always did.
- tapOn:
    id: "fab"
- tapOn:
    id: "type-transfer"
# Cash -> Bank is the default pair, so this one needs no picker.
- tapOn:
    id: "record-note"
- inputText: "moving to bank"
- hideKeyboard
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

- tapOn:
    id: "fab"
- tapOn:
    id: "type-transfer"
- tapOn:
    id: "pick-account"
- tapOn: "Bank"
# The To account has to be set as well: it still holds the default second
# account, which is now the same one, and a transfer to itself is refused.
- tapOn:
    id: "pick-to-account"
- tapOn: "Cash"
- tapOn:
    id: "record-note"
- inputText: "cash withdrawal"
- hideKeyboard
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "home-screen"

# --- the screen opens with nothing searched ---
- tapOn:
    id: "nav-search"
- assertVisible:
    id: "search-screen"
# An empty query must NOT return the ledger. If this ever starts showing rows,
# search has quietly become the records list with its month navigator removed.
- assertVisible: "Search every record"
- assertNotVisible:
    id: "search-count"

# --- text matches the note ---
- tapOn:
    id: "search-input"
- inputText: "Cilantro"
- assertVisible:
    id: "search-count"
    text: "1 record"
# The total over the matches, not over the month. This is the assertion that
# fails if the query stops filtering.
- assertVisible:
    id: "search-expense"
    text: "-E£250.00"
- assertVisible: "Coffee"
- assertNotVisible: "dinner"
- takeScreenshot: 01-search-note

# --- text matches the CATEGORY name, which appears in no note ---
- eraseText
- inputText: "Restaurants"
- assertVisible:
    id: "search-count"
    text: "1 record"
- assertVisible:
    id: "search-expense"
    text: "-E£80.00"

# --- a query that matches nothing says so, rather than showing everything ---
- eraseText
- inputText: "zzzz"
- assertVisible: "No records match"
- assertVisible:
    id: "search-count"
    text: "0 records"

# --- clearing the text returns to the prompt, not to a full list ---
- eraseText
- assertVisible: "Search every record"

# --- filter by the PARENT category: both sub-categories have to come back ---
- hideKeyboard
- tapOn:
    id: "search-filters"
- assertVisible:
    id: "search-filter-panel"
# The chip labels are asserted in full because Android measured "This year" a
# fraction wider than it then laid out, wrapped it onto a second line the chip
# has no height for, and rendered "This" inside a chip sized for "This year".
# Nothing about that looks like a wrap, so only the text catches it.
- assertVisible:
    id: "filter-range-year"
    text: "This year"
- assertVisible:
    id: "filter-range-quarter"
    text: "Last 3 months"
- tapOn:
    id: "filter-category"
- tapOn: "Food"
# Picking "Food" and being told there are no records — because every one of them
# is filed under Coffee or Restaurants — is the filter lying about the data.
- assertVisible:
    id: "search-count"
    text: "2 records"
- assertVisible:
    id: "search-expense"
    text: "-E£330.00"
# The filter button carries the count while the panel is collapsed.
- assertVisible:
    id: "search-filter-count"
    text: "1"
- takeScreenshot: 02-search-category

# --- clearing puts it back ---
- tapOn:
    id: "filter-clear"
- assertVisible: "Search every record"

# --- filter by type ---
- tapOn:
    id: "filter-kind-income"
- assertVisible:
    id: "search-count"
    text: "1 record"
- assertVisible:
    id: "search-income"
    text: "E£9,000.00"
# Income only: the two expenses must not be in the total.
- assertNotVisible:
    id: "search-expense"

# Tapping the selected chip clears it — the only undo that is where the filter
# was set.
- tapOn:
    id: "filter-kind-income"
- assertVisible: "Search every record"

# --- a transfer is filtered by where it LANDED ---
#
# Search lists only the OUTGOING leg, so the Account row is the account the
# money left. Without a second row for the far end, "what arrived in Bank" is a
# question the screen cannot ask at all — the leg that would answer it is the
# one deliberately hidden.

# First: switching to Transfer must DROP the category filter rather than hide
# it. A transfer has no category, so a filter left set behind a control that is
# no longer on screen empties the results with nothing on screen to say why.
- tapOn:
    id: "filter-category"
- tapOn: "Food"
- assertVisible:
    id: "search-count"
    text: "2 records"
- tapOn:
    id: "filter-kind-transfer"
# Both transfers, not zero — and the badge counts ONE filter, not two. If the
# category leaked through, this reads "0 records" under a badge of "2".
- assertVisible:
    id: "search-count"
    text: "2 records"
- assertVisible:
    id: "search-filter-count"
    text: "1"

# The Category row is replaced by the two ends of the transfer.
- assertNotVisible:
    id: "filter-category"
- assertVisible:
    id: "filter-counter-account"
- tapOn:
    id: "filter-counter-account"
- tapOn: "Bank"
- assertVisible:
    id: "search-count"
    text: "1 record"
# The one that ARRIVED in Bank — the other transfer LEFT Bank, and is what
# comes back if this filter is ever pointed at account_id.
#
# Asserted on the row's own subtitle rather than on the note: a transfer row
# renders "<from> → <to>" and does not show its note at all, so the direction
# IS the visible text. It is also the stronger assertion of the two — it names
# both ends, and the wrong leg would read "Bank → Cash".
- assertVisible: "Cash → Bank"
- assertNotVisible: "Bank → Cash"
# Narrowing to transfers must not turn them into spending: a screen showing
# only transfers shows no total at all.
- assertNotVisible:
    id: "search-expense"
- assertNotVisible:
    id: "search-income"
- takeScreenshot: 03-search-transfer-destination

- tapOn:
    id: "filter-clear"
- assertVisible: "Search every record"

# --- filter by amount, unsigned ---
# 250 is stored as -25000. A signed comparison would miss it and this would
# come back with only the salary.
- tapOn:
    id: "filter-min"
- inputText: "100"
- hideKeyboard
- assertVisible:
    id: "search-count"
    text: "2 records"
- assertVisible:
    id: "search-expense"
    text: "-E£250.00"

# --- a result opens the record it stands for ---
- tapOn:
    id: "search-filters"
- tapOn: "Coffee"
- assertVisible:
    id: "record-screen"
- assertVisible:
    id: "amount-display"
    text: "250"
- assertVisible: "Cilantro flat white"
- takeScreenshot: 04-search-opens-record
