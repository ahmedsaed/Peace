appId: com.ahmed.peace
---
# Standing orders.
#
# A rule is created from the RECORD SCREEN, not from a form of its own — the
# amount, account and category pickers already live there. This flow enters a
# payment the ordinary way, taps Repeat, and then checks the two things that
# matter:
#
#   the record it was created from exists exactly ONCE, and
#   the rule does not write anything else to the ledger by itself.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

- assertVisible:
    id: "summary-expense"
    text: "E£0.00"

# --- enter rent, and make it repeat ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Bills"
    direction: DOWN
- tapOn: "Bills"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"

# The button is an icon with no text, so its state is not assertable by label —
# what IS assertable is that opening it offers no repeat yet, and that a rule
# exists afterwards. Both are checked below.
- tapOn:
    id: "record-repeat"
- assertVisible:
    id: "repeat-sheet"
- tapOn:
    id: "repeat-monthly"
# The preview says the schedule in words, so it is checkable without doing date
# maths in your head.
- assertVisible:
    id: "repeat-preview"
    text: "Every month on the .*"
- takeScreenshot: 01-repeat-sheet
- tapOn:
    id: "repeat-save"

- takeScreenshot: 02-record-with-repeat
- tapOn:
    id: "record-save"

# --- the record is written ONCE ---
# THE ASSERTION THAT MATTERS. The rule starts on this record's date, so a naive
# implementation would immediately owe the very occurrence just entered and
# offer it again as a due row — E£1,000 of rent from one payment.
- assertVisible:
    id: "summary-expense"
    text: "-E£5,000.00"
- assertNotVisible:
    id: "due-actions"
- takeScreenshot: 03-saved-once

# --- and it is visible in NEXT month, before it is owed ---
# Most of why anyone writes a rule down: next month's rent should be in next
# month's list. It is greyed and in no total, because it has not happened.
- tapOn:
    id: "month-next"
- assertVisible: "Upcoming"
- assertVisible: "Bills"
- assertVisible:
    id: "summary-expense"
    text: "E£0.00"
- takeScreenshot: 05-upcoming
- tapOn:
    id: "month-prev"

# --- the rule exists, and says what it will do ---
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-recurring"
- assertVisible:
    id: "recurring-screen"
- assertVisible: "Every month on the .*"
# The next run reads as a DATE a person can parse — the redesign replaced a raw
# "next 2026-09-12" with "12 Sep". That it is in the future is what matters:
# the occurrence just written is settled, not still owed.
# `[a-z]+`, not `[a-z]{2}`: Android renders September as "Sept", not "Sep" —
# Hermes ships different ICU data from Node, and `assertVisible` matches WHOLE
# text, so a four-letter month simply does not match a three-letter pattern.
- assertVisible: "[0-9]{1,2} [A-Z][a-z]+"
- takeScreenshot: 04-rules

# --- pausing stops it without deleting anything ---
# Behind a long press, the same gesture a record uses — a destructive action
# does not earn a permanent button on every row.
- longPressOn: "Bills"
- assertVisible:
    id: "rule-actions"
- assertVisible:
    id: "rule-delete"
- takeScreenshot: 06-rule-actions
- tapOn:
    id: "rule-toggle"
- assertVisible: "Paused"
- tapOn:
    id: "nav-back"
- assertVisible:
    id: "summary-expense"
    text: "-E£5,000.00"
