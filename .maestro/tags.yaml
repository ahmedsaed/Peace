appId: com.ahmed.peace
---
# Tags: the axis categories cannot be.
#
# The case the whole feature exists for is a project — one that ends. A
# sub-category called "Kitchen reno" is in the picker and in the ring for ever;
# the renovation is not. And a project crosses categories, which one exclusive
# axis cannot express at all.
#
# So the assertions here are the CROSS-CATEGORY total and the filtered ring,
# not that a chip appeared. A tag that attached to nothing, or that gathered
# instead of narrowing, would still render chips and still look correct.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- E£1,200 of tiles under Home ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Home"
    direction: DOWN
- tapOn: "Home"
- tapOn:
    id: "record-note"
- inputText: "Tiles"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"

# The tag is made from the record, where the rest of it is already being typed.
- tapOn:
    id: "record-tags"
- assertVisible:
    id: "tag-sheet"
- tapOn:
    id: "tag-input"
- inputText: "Kitchen"
# THE FIELD AND THE LIST BELOW IT, WITH THE KEYBOARD UP. A Modal is its own
# window and does not resize the way the app's window does, so without lifting
# the sheet by hand the entire list sits underneath the keyboard.
- assertVisible:
    id: "tag-create"
- tapOn:
    id: "tag-create"
- hideKeyboard
- tapOn:
    id: "tag-done"
# Selected as well as created. A tag you made and then had to find in the list
# would be a picker asking you to confirm what you just typed.
- assertVisible: "Kitchen"
- takeScreenshot: 01-tagged
- tapOn:
    id: "record-save"

# It shows in the ledger, marked so it does not read as more note.
- assertVisible: "Cash · “Tiles” · #Kitchen"

# --- E£300 of lunch under Food, same tag ---
# A DIFFERENT category, which is the whole point: one exclusive axis cannot
# answer "what did the kitchen cost".
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Restaurants"
    direction: DOWN
- tapOn: "Restaurants"
- tapOn:
    id: "record-note"
- inputText: "Builders lunch"
- hideKeyboard
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-tags"
# The tag exists now, so it is picked rather than typed.
- tapOn:
    id: "tag-row-kitchen"
- tapOn:
    id: "tag-done"
- tapOn:
    id: "record-save"

# --- one untagged record, so the tag has to actually narrow something ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- tapOn: "Coffee"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"
- assertVisible:
    id: "summary-expense"
    text: "-E£1,550.00"

# ===========================================================================
# Search — the lifetime total for the project
# ===========================================================================
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-filters"
- tapOn:
    id: "filter-tags"
- tapOn:
    id: "tag-row-kitchen"
- tapOn:
    id: "tag-done"
- hideKeyboard
# TWO records across TWO categories, and E£1,500 — not E£1,550. This is the
# assertion the feature exists for, and it fails if the tag attached to nothing,
# if it matched everything, or if the total came from the rows on screen.
- assertVisible:
    id: "search-count"
    text: "2 records"
- assertVisible:
    id: "search-expense"
    text: "-E£1,500.00"
- assertVisible: "Home"
- assertVisible: "Restaurants"
- assertNotVisible: "Coffee"
- takeScreenshot: 02-search-by-tag

# Typing the name finds it too, without opening the filters at all.
- tapOn:
    id: "filter-clear"
- tapOn:
    id: "search-input"
- inputText: "Kitchen"
- assertVisible:
    id: "search-count"
    text: "2 records"
# The keyboard first: Android's back closes the IME before it leaves a screen,
# so without this the `back` is spent on the keyboard and the next tap looks
# for a tab bar that is still two screens away.
- hideKeyboard
- back

# ===========================================================================
# Analysis — a list of tags, and a ring filtered by one
# ===========================================================================
- tapOn:
    id: "tab-analysis"
- assertVisible:
    id: "analysis-total"
    text: "E£1,550.00"
- scrollUntilVisible:
    element:
      id: "analysis-tags"
    direction: DOWN
# Amounts, never percentages: tags overlap and most records carry none, so a
# ring of them could not sum to 100.
- assertVisible:
    id: "analysis-tag-amount-Kitchen"
    text: "E£1,500.00"
- takeScreenshot: 03-analysis-tags

# Tapping it filters the RING, which is the honest way to see a tag as a chart:
# within a tag, categories are still exclusive and still add to 100%.
- tapOn:
    id: "analysis-tag-Kitchen"
- scrollUntilVisible:
    element:
      id: "analysis-total"
    direction: UP
- assertVisible:
    id: "analysis-total"
    text: "E£1,500.00"
# The ring says what it is showing. The row that set this is far below and
# usually scrolled off, so without this the chart quietly means something
# narrower than the header above it.
- assertVisible:
    id: "analysis-scope"
    text: "Kitchen"
- takeScreenshot: 04-analysis-filtered

# ===========================================================================
# The project ends — archive keeps the history and drops the offer
# ===========================================================================
- tapOn:
    id: "tab-index"
- tapOn: "Home"
- tapOn:
    id: "record-tags"
- longPressOn:
    id: "tag-row-kitchen"
- assertVisible:
    id: "tag-editing"
- tapOn:
    id: "tag-archive"
# Off the picker...
- assertVisible:
    id: "tag-empty"
- tapOn:
    id: "tag-done"
- tapOn:
    id: "record-cancel"

# ...and still on the records that were part of it. Deleting the tag instead
# would rewrite history to say the spending was never part of anything.
- assertVisible: "Cash · “Tiles” · #Kitchen"
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-input"
- inputText: "Kitchen"
- assertVisible:
    id: "search-count"
    text: "2 records"
- takeScreenshot: 05-archived-still-found

# ===========================================================================
# ...and the way back, which did not exist
# ===========================================================================
# `setTagArchived` was only ever called with `true` from any screen, so a
# finished project was finished for good. Settings now offers it again — and
# the assertion that matters is the PICKER offering it, not the sheet listing
# it.
#
# Leaving the search screen first: it is a stack screen with its own header,
# so the drawer button that Settings is behind is not on it.
- tapOn:
    id: "nav-back"
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- assertVisible:
    id: "setting-archived-tags"
- assertVisible: "1 put away"
- tapOn:
    id: "setting-archived-tags"
- assertVisible:
    id: "sheet-archived-tags"
- tapOn: "Kitchen"
- assertVisible:
    id: "archive-restored"
- takeScreenshot: 06-tag-restored

- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "record-tags"
# Back in the list that stopped offering it — and still carrying the records it
# never left, which the search above already proved.
- assertVisible:
    id: "tag-row-kitchen"
- tapOn:
    id: "tag-done"
- tapOn:
    id: "record-cancel"
- takeScreenshot: 07-tag-offered-again

# ===========================================================================
# ...and deleting it, which is not the same thing at all
# ===========================================================================
# Archiving keeps the label on its records; deleting takes it off them. The
# sheet says how many are about to forget BEFORE the second tap, because that
# is the only moment the number can still change anyone's mind.
- tapOn:
    id: "fab"
- tapOn:
    id: "record-tags"
- longPressOn:
    id: "tag-row-kitchen"
- tapOn:
    id: "tag-archive"
- tapOn:
    id: "tag-done"
- tapOn:
    id: "record-cancel"

- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "setting-archived-tags"
- assertVisible:
    id: "sheet-archived-tags"
# The cost is on the row before it is on the confirmation.
- assertVisible: "On 2 records"
- tapOn:
    id: "archive-delete-kitchen"
- assertVisible: "Delete Kitchen for good?"
- assertVisible: ".*2 records will lose the label.*"
- takeScreenshot: 08-tag-delete-armed
- tapOn:
    id: "archive-confirm-kitchen"
- assertVisible:
    id: "archive-restored"
- assertVisible: "Kitchen deleted, and taken off 2 records."

# THE ASSERTION THAT MATTERS: the records kept everything a record is, and
# lost only the label. Deleting a tag must never reach the money.
- tapOn:
    id: "tab-index"
- assertNotVisible: "Cash · “Tiles” · #Kitchen"
- assertVisible: ".*Tiles.*"
- assertVisible: "-E£1,200.00"
- takeScreenshot: 09-tag-deleted
