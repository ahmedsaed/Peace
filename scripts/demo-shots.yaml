      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "Airport run"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-2"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "To the office"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-8"
- tapOn:
    id: "record-save"

# --- the big one, and one deliberately left unbudgeted ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Installments"
    direction: DOWN
- tapOn: "Installments"
- tapOn:
    id: "record-note"
- inputText: "Phone, 6 of 12"
- hideKeyboard
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Shopping"
    direction: DOWN
- tapOn: "Shopping"
- tapOn:
    id: "record-note"
- inputText: "Winter jacket"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# ===========================================================================
# 1. Records — the month at a glance
# ===========================================================================
- assertVisible:
    id: "records-list"
- assertVisible:
    id: "summary-expense"
    text: "-\\$690.00"
- takeScreenshot: records

# ===========================================================================
# 2. Record entry — pickers, note, keypad, and the flow key
# ===========================================================================
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Groceries"
    direction: DOWN
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Farmers' market"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-2"
- assertVisible:
    id: "amount-display"
    text: "42"
- takeScreenshot: record
- tapOn:
    id: "record-cancel"

# ===========================================================================
# 3. Budgets — four limits chosen to show every state at once
# ===========================================================================
- tapOn:
    id: "tab-budgets"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-food"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-food"
- inputText: "400"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-bills"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-bills"
- inputText: "160"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-installments"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-installments"
- inputText: "100"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-transport"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-transport"
- inputText: "50"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-total-budget"
    direction: UP
# The assertions that keep the screenshot honest. If the roll-up ever broke,
# Food would read 0% and this would capture a wrong screen rather than fail.
- assertVisible:
    id: "budget-percent-seed-cat-food"
    text: "64%"
- assertVisible:
    id: "budget-left-seed-cat-transport"
    text: "\\$10.00 over"
- assertVisible:
    id: "budget-total-budget"
    text: "\\$710.00"
- takeScreenshot: budgets

# ===========================================================================
# 4. Analysis — the category ring and the ranked shares
# ===========================================================================
- tapOn:
    id: "tab-analysis"
# Food is 256 of the 690 spent. The share is asserted because a ring
# drawn from the wrong total still looks exactly like a ring.
- assertVisible:
    id: "analysis-total"
    text: "\\$690.00"
- assertVisible:
    id: "analysis-percent-seed-cat-food"
    text: "37.1%"
# The ring is touchable: the shot shows a tooltip open on Food, since a reader
# of a still image cannot find that out for themselves. The point is relative
# to the ring's own box, a third of the way round Food's arc.
- tapOn:
    id: "donut-touch"
    point: "90%,40%"
- assertVisible:
    id: "donut-tooltip-figure"
    text: "37.1%"
- takeScreenshot: analysis
# Installments is the smallest slice but one — rounded with the rest so the
# legend sums to exactly 100. Below the ring now that it fills the width, so
# checked after the shot and scrolled back from.
- scrollUntilVisible:
    element:
      id: "analysis-percent-seed-cat-installments"
    direction: DOWN
- assertVisible:
    id: "analysis-percent-seed-cat-installments"
    text: "13.0%"
- scrollUntilVisible:
    element:
      id: "donut-touch"
    direction: UP
# Put away again, so the theme shots below show the ring with its total.
- tapOn:
    id: "donut-touch"
    point: "50%,50%"

# ===========================================================================
# 5. Search — the filters, and the total over what was found
# ===========================================================================
# Deliberately a FILTERED result rather than a text search. Typing "Cash"
# matches all ten records, which produces a screenshot almost identical to the
# records list — a wasted tile in a six-image grid. Filtering by Food returns
# three, so the shot shows search actually narrowing something, shows the
# filter panel, and shows the parent-matches-children rule: none of these three
# records is filed under Food itself.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-filters"
- tapOn:
    id: "filter-category"
- scrollUntilVisible:
    element:
      text: "Food"
    direction: DOWN
- tapOn: "Food"
# The search field has autoFocus, so the keyboard springs back the moment the
# picker closes and covers two of the three results. Without this the shot is a
# screenshot of a keyboard.
- hideKeyboard
- assertVisible:
    id: "search-count"
    text: "3 records"
- assertVisible:
    id: "search-expense"
    text: "-\\$256.00"
# All three have to be on screen, or the tile shows a filter that found things
# the reader cannot see.
- assertVisible: "Groceries"
- assertVisible: "Restaurants"
- assertVisible: "Coffee"
- takeScreenshot: search

# ===========================================================================
# 6. Accounts — balances derived from the ledger, and a card read as debt
# ===========================================================================
# Everything below this line is seeded AFTER the five shots above, because it
# adds records and every one of those shots asserts an exact total.
- back
- tapOn:
    id: "tab-accounts"
- tapOn:
    id: "fab-account"
- tapOn:
    id: "account-name"
- inputText: "Travel card"
- hideKeyboard
- tapOn:
    id: "acct-type-card"
# A card gets a LIMIT, never an opening balance: what it starts owing arrives as
# a dated correction instead. The fee lives on the card, not in the app.
- tapOn:
    id: "account-limit"
- inputText: "5000"
- hideKeyboard
- tapOn:
    id: "account-foreign-fee"
- inputText: "3"
- hideKeyboard
- tapOn:
    id: "form-save"

# --- something on the card, so it has a debt to read ---
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-account"
- tapOn: "Travel card"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Shopping"
    direction: DOWN
- tapOn: "Shopping"
- tapOn:
    id: "record-note"
- inputText: "Headphones"
- hideKeyboard
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- and some of the cash moved to the bank ---
# Three accounts with one of them at zero reads as a half-set-up app. It also
# puts a transfer in the ledger, which is the pair of rows the whole schema is
# shaped around.
- tapOn:
    id: "fab"
- tapOn:
    id: "type-transfer"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "tab-accounts"
# The assertion that keeps this shot honest. A card at -230 is two hundred and
# thirty of DEBT, not an emptied wallet — and the limit is what is left
# of it, not a second balance. If either ever rendered like an ordinary account
# this would capture a wrong screen rather than fail.
- assertVisible:
    id: "account-sub-.*"
    text: "\\$4,770.00 of \\$5,000.00 available"
- takeScreenshot: accounts

# ===========================================================================
# 7. Long press — a refund that knows what it refunds
# ===========================================================================
# NOT the account form with the correction sheet over it, which was the obvious
# choice for this slot: reaching the "Update balance" button means scrolling
# past the colour and icon pickers, so two thirds of the frame is a grid of
# swatches. At 180px in a README that reads as texture, not as a feature.
- tapOn:
    id: "tab-index"

# Return $40 of the $140 jacket, so the sheet has a real figure to report rather
# than "all of it".
- longPressOn: "Cash · “Winter jacket”"
- tapOn:
    id: "action-refund"
- eraseText
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# The PURCHASE, not the refund it now carries: matched on its own subtitle,
# which the refund's extends rather than repeats ("Cash · refunded · …"), and
# Maestro matches whole text.
- longPressOn: "Cash · “Winter jacket”"
- assertVisible:
    id: "record-actions"
# How much came back, not merely that some did — the difference between $40
# and all of it is the entire question, and it is what a purchase could never
# say before.
- assertVisible: "Refunded · \\$40.00 of \\$140.00"
- assertVisible:
    id: "link-undone-0"
- takeScreenshot: actions
- back

# ===========================================================================
# 8. Recurring — standing orders, set while entering the record
# ===========================================================================
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Home"
    direction: DOWN
- tapOn: "Home"
- tapOn:
    id: "record-note"
- inputText: "Flat rent"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-repeat"
- tapOn:
    id: "repeat-monthly"
- tapOn:
    id: "repeat-day"
- inputText: "1"
- hideKeyboard
- tapOn:
    id: "repeat-save"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Insurance"
    direction: DOWN
- tapOn: "Insurance"
- tapOn:
    id: "record-note"
- inputText: "Car cover"
- hideKeyboard
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-repeat"
- tapOn:
    id: "repeat-monthly"
- tapOn:
    id: "repeat-day"
- inputText: "9"
- hideKeyboard
- tapOn:
    id: "repeat-save"
- tapOn:
    id: "record-save"

- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-recurring"
- assertVisible:
    id: "recurring-screen"
# Two, not "some". A rule that silently failed to save would leave a screen
# that still looks entirely correct.
- assertVisible:
    id: "rule-count"
    text: "2 rules"
- takeScreenshot: recurring

# ===========================================================================
# 9. Portfolio — rebalancing, deliberately not wired into the ledger
# ===========================================================================
- back
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-portfolio"
- assertVisible:
    id: "portfolio-screen"

- tapOn:
    id: "portfolio-class-name"
- inputText: "Stocks"
- tapOn:
    id: "portfolio-class-target"
- inputText: "60"
- hideKeyboard
- tapOn:
    id: "portfolio-class-add"

- tapOn:
    id: "portfolio-class-name"
- inputText: "Bonds"
- tapOn:
    id: "portfolio-class-target"
- inputText: "40"
- hideKeyboard
- tapOn:
    id: "portfolio-class-add"

# Deliberately off balance — 700 of stocks against 300 of bonds on a 60/40
# target. A portfolio already at its target shows a screen of zeroes and
# demonstrates nothing.
- tapOn:
    id: "portfolio-holding-name"
- inputText: "Index fund"
- tapOn:
    id: "portfolio-pick-stocks"
- tapOn:
    id: "portfolio-holding-units"
- inputText: "7"
- tapOn:
    id: "portfolio-holding-price"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "portfolio-holding-add"

- tapOn:
    id: "portfolio-holding-name"
- inputText: "Bond fund"
- tapOn:
    id: "portfolio-pick-bonds"
- tapOn:
    id: "portfolio-holding-units"
- inputText: "3"
- tapOn:
    id: "portfolio-holding-price"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "portfolio-holding-add"

- scrollUntilVisible:
    element:
      id: "portfolio-drift"
    direction: DOWN
# The drift is the gap a person would actually check, and it is the figure a
# plan drawn from the wrong total would get wrong while still looking like a
# plan.
- assertVisible: "\\+10.0%"
- assertVisible: "-10.0%"
- takeScreenshot: portfolio

# ===========================================================================
# 10. Themes — the same month in every theme, for the website's themes section
# ===========================================================================
# Last, so every theme photographs the SAME ledger: the records and the ring
# change colour and nothing else does. Ledger goes last as well, so the device
# is left the way the flow found it.
- back
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "settings-section-appearance"
# The grid is a little taller than the screen; at the foot, every
