- assertVisible:
    id: "theme-selected"
    childOf:
      id: "theme-option-graphite"
- back
- back
- assertVisible:
    id: "home-screen"
- takeScreenshot: theme-graphite-records
- tapOn:
    id: "tab-analysis"
- takeScreenshot: theme-graphite-analysis
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "settings-section-appearance"
