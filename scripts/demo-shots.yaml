appId: com.ahmed.peace
---
# Regenerates the README screenshots from a seeded demo ledger.
#
# NOT in .maestro/, on purpose: `npm run e2e` runs that whole directory, and
# this takes several minutes while asserting almost nothing. Run `npm run shots`.
#
# It is a flow rather than a set of hand-taken captures because hand-taken
# screenshots rot. The moment a colour, a label or a layout changes, the README
# is quietly advertising an app that no longer exists — and nothing fails, so
# nobody notices. This regenerates all NINE in one command.
#
# ORDER MATTERS. The first five shots assert exact totals, so everything that
# adds a record — the card purchase, the two standing orders — comes AFTER them.
# Seeding it earlier would mean recomputing four assertions by hand every time
# the demo ledger changed, which is how a flow ends up asserting nothing.
#
# THE LEDGER BELOW IS INVENTED. The repository is public and real records do not
# go in it. The amounts are chosen so the budget screen shows every state at
# once — a screenshot of four identical bars demonstrates nothing:
#
#   Food            840 + 265 + 95  = 1,200  of 2,000    60%   comfortable
#   Bills           380 + 500       =   880  of 1,000    88%   close
#   Installments    4,500           = 4,500  of 5,000    90%   close
#   Transportation  600 + 140       =   740  of   500   148%   over by 240
#   Shopping        1,200                     unbudgeted
#
# Food's 1,200 is spread across three SUB-categories, so the shot shows the
# roll-up working rather than only asserting it in a unit test.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- income first, so the month reads as a real month and not a deficit ---
- tapOn:
    id: "fab"
- tapOn:
    id: "type-income"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Salary"
    direction: DOWN
- tapOn: "Salary"
- tapOn:
    id: "record-note"
- inputText: "August salary"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- Food, across three sub-categories ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Groceries"
    direction: DOWN
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Weekly shop"
- hideKeyboard
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Restaurants"
    direction: DOWN
- tapOn: "Restaurants"
- tapOn:
    id: "record-note"
- inputText: "Dinner out"
- hideKeyboard
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-5"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- tapOn: "Coffee"
- tapOn:
    id: "record-note"
- inputText: "Flat white"
- hideKeyboard
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-5"
- tapOn:
    id: "record-save"

# --- Bills ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Electricity"
    direction: DOWN
- tapOn: "Electricity"
- tapOn:
    id: "record-note"
- inputText: "July meter"
- hideKeyboard
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Internet"
    direction: DOWN
- tapOn: "Internet"
- tapOn:
    id: "record-note"
- inputText: "Fibre"
- hideKeyboard
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- Transportation, which ends up over budget ---
# Both under Taxi. `Fuel` would have been the natural second one and is a trap:
# it is a child of CAR, not Transportation, so the 600 would have rolled up to a
# category with no budget and the over-budget row would never have appeared.
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "Airport run"
- hideKeyboard
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "To the office"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- the big one, and one deliberately left unbudgeted ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Installments"
    direction: DOWN
- tapOn: "Installments"
- tapOn:
    id: "record-note"
- inputText: "Phone, 6 of 12"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Shopping"
    direction: DOWN
- tapOn: "Shopping"
- tapOn:
    id: "record-note"
- inputText: "Winter jacket"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# ===========================================================================
# 1. Records — the month at a glance
# ===========================================================================
- assertVisible:
    id: "records-list"
- assertVisible:
    id: "summary-expense"
    text: "-E£8,520.00"
- takeScreenshot: records

# ===========================================================================
# 2. Record entry — pickers, note, keypad, and the flow key
# ===========================================================================
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Groceries"
    direction: DOWN
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Seoudi, weekly"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-5"
- assertVisible:
    id: "amount-display"
    text: "425"
- takeScreenshot: record
- tapOn:
    id: "record-cancel"

# ===========================================================================
# 3. Budgets — four limits chosen to show every state at once
# ===========================================================================
- tapOn:
    id: "tab-budgets"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-food"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-food"
- inputText: "2000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-bills"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-bills"
- inputText: "1000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-installments"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-installments"
- inputText: "5000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-transport"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-transport"
- inputText: "500"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-total-budget"
    direction: UP
# The assertions that keep the screenshot honest. If the roll-up ever broke,
# Food would read 0% and this would capture a wrong screen rather than fail.
- assertVisible:
    id: "budget-percent-seed-cat-food"
    text: "60%"
- assertVisible:
    id: "budget-left-seed-cat-transport"
    text: "E£240.00 over"
- assertVisible:
    id: "budget-total-budget"
    text: "E£8,500.00"
- takeScreenshot: budgets

# ===========================================================================
# 4. Analysis — the category ring and the ranked shares
# ===========================================================================
- tapOn:
    id: "tab-analysis"
# Installments is 4,500 of the 8,520 spent. The share is asserted because a ring
# drawn from the wrong total still looks exactly like a ring.
- assertVisible:
    id: "analysis-total"
    text: "E£8,520.00"
- assertVisible:
    id: "analysis-percent-seed-cat-installments"
    text: "52.8%"
# Food's 1,200 is three sub-categories rolled up, same as the budget tile.
- assertVisible:
    id: "analysis-percent-seed-cat-food"
    text: "14.1%"
- takeScreenshot: analysis

# ===========================================================================
# 5. Search — the filters, and the total over what was found
# ===========================================================================
# Deliberately a FILTERED result rather than a text search. Typing "Cash"
# matches all ten records, which produces a screenshot almost identical to the
# records list — a wasted tile in a six-image grid. Filtering by Food returns
# three, so the shot shows search actually narrowing something, shows the
# filter panel, and shows the parent-matches-children rule: none of these three
# records is filed under Food itself.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-filters"
- tapOn:
    id: "filter-category"
- scrollUntilVisible:
    element:
      text: "Food"
    direction: DOWN
- tapOn: "Food"
# The search field has autoFocus, so the keyboard springs back the moment the
# picker closes and covers two of the three results. Without this the shot is a
# screenshot of a keyboard.
- hideKeyboard
- assertVisible:
    id: "search-count"
    text: "3 records"
- assertVisible:
    id: "search-expense"
    text: "-E£1,200.00"
# All three have to be on screen, or the tile shows a filter that found things
# the reader cannot see.
- assertVisible: "Groceries"
- assertVisible: "Restaurants"
- assertVisible: "Coffee"
- takeScreenshot: search

# ===========================================================================
# 6. Accounts — balances derived from the ledger, and a card read as debt
# ===========================================================================
# Everything below this line is seeded AFTER the five shots above, because it
# adds records and every one of those shots asserts an exact total.
- back
- tapOn:
    id: "tab-accounts"
- tapOn:
    id: "fab-account"
- tapOn:
    id: "account-name"
- inputText: "Kenana"
- hideKeyboard
- tapOn:
    id: "acct-type-card"
# A card gets a LIMIT, never an opening balance: what it starts owing arrives as
# a dated correction instead. The fee lives on the card, not in the app.
- tapOn:
    id: "account-limit"
- inputText: "50000"
- hideKeyboard
- tapOn:
    id: "account-foreign-fee"
- inputText: "3"
- hideKeyboard
- tapOn:
    id: "form-save"

# --- something on the card, so it has a debt to read ---
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-account"
- tapOn: "Kenana"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Shopping"
    direction: DOWN
- tapOn: "Shopping"
- tapOn:
    id: "record-note"
- inputText: "Headphones"
- hideKeyboard
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- and some of the cash moved to the bank ---
# Three accounts with one of them at zero reads as a half-set-up app. It also
# puts a transfer in the ledger, which is the pair of rows the whole schema is
# shaped around.
- tapOn:
    id: "fab"
- tapOn:
    id: "type-transfer"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "tab-accounts"
# The assertion that keeps this shot honest. A card at -2,300 is two thousand
# three hundred of DEBT, not an emptied wallet — and the limit is what is left
# of it, not a second balance. If either ever rendered like an ordinary account
# this would capture a wrong screen rather than fail.
- assertVisible:
    id: "account-sub-.*"
    text: "E£47,700.00 of E£50,000.00 available"
- takeScreenshot: accounts

# ===========================================================================
# 7. Long press — a refund that knows what it refunds
# ===========================================================================
# NOT the account form with the correction sheet over it, which was the obvious
# choice for this slot: reaching the "Update balance" button means scrolling
# past the colour and icon pickers, so two thirds of the frame is a grid of
# swatches. At 180px in a README that reads as texture, not as a feature.
- tapOn:
    id: "tab-index"

# Return part of the jacket, so the sheet has a real figure to report rather
# than "all of it".
- longPressOn: "Cash · “Winter jacket”"
- tapOn:
    id: "action-refund"
- eraseText
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# The PURCHASE, not the refund it now carries: matched on its own subtitle,
# which the refund's extends rather than repeats ("Cash · refunded · …"), and
# Maestro matches whole text.
- longPressOn: "Cash · “Winter jacket”"
- assertVisible:
    id: "record-actions"
# How much came back, not merely that some did — the difference between E£400
# and all of it is the entire question, and it is what a purchase could never
# say before.
- assertVisible: "Refunded · E£400.00 of E£1,200.00"
- assertVisible:
    id: "link-undone-0"
- takeScreenshot: actions
- back

# ===========================================================================
# 8. Recurring — standing orders, set while entering the record
# ===========================================================================
- tapOn:
    id: "tab-index"
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Home"
    direction: DOWN
- tapOn: "Home"
- tapOn:
    id: "record-note"
- inputText: "Flat rent"
- hideKeyboard
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-repeat"
- tapOn:
    id: "repeat-monthly"
- tapOn:
    id: "repeat-day"
- inputText: "1"
- hideKeyboard
- tapOn:
    id: "repeat-save"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Insurance"
    direction: DOWN
- tapOn: "Insurance"
- tapOn:
    id: "record-note"
- inputText: "Car cover"
- hideKeyboard
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-repeat"
- tapOn:
    id: "repeat-monthly"
- tapOn:
    id: "repeat-day"
- inputText: "9"
- hideKeyboard
- tapOn:
    id: "repeat-save"
- tapOn:
    id: "record-save"

- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-recurring"
- assertVisible:
    id: "recurring-screen"
# Two, not "some". A rule that silently failed to save would leave a screen
# that still looks entirely correct.
- assertVisible:
    id: "rule-count"
    text: "2 rules"
- takeScreenshot: recurring

# ===========================================================================
# 9. Portfolio — rebalancing, deliberately not wired into the ledger
# ===========================================================================
- back
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-portfolio"
- assertVisible:
    id: "portfolio-screen"

- tapOn:
    id: "portfolio-class-name"
- inputText: "Stocks"
- tapOn:
    id: "portfolio-class-target"
- inputText: "60"
- hideKeyboard
- tapOn:
    id: "portfolio-class-add"

- tapOn:
    id: "portfolio-class-name"
- inputText: "Bonds"
- tapOn:
    id: "portfolio-class-target"
- inputText: "40"
- hideKeyboard
- tapOn:
    id: "portfolio-class-add"

# Deliberately off balance — 700 of stocks against 300 of bonds on a 60/40
# target. A portfolio already at its target shows a screen of zeroes and
# demonstrates nothing.
- tapOn:
    id: "portfolio-holding-name"
- inputText: "Index fund"
- tapOn:
    id: "portfolio-pick-stocks"
- tapOn:
    id: "portfolio-holding-units"
- inputText: "7"
- tapOn:
    id: "portfolio-holding-price"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "portfolio-holding-add"

- tapOn:
    id: "portfolio-holding-name"
- inputText: "Bond fund"
- tapOn:
    id: "portfolio-pick-bonds"
- tapOn:
    id: "portfolio-holding-units"
- inputText: "3"
- tapOn:
    id: "portfolio-holding-price"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "portfolio-holding-add"

- scrollUntilVisible:
    element:
      id: "portfolio-drift"
    direction: DOWN
# The drift is the gap a person would actually check, and it is the figure a
# plan drawn from the wrong total would get wrong while still looking like a
# plan.
- assertVisible: "\\+10.0%"
- assertVisible: "-10.0%"
- takeScreenshot: portfolio
