- tapOn:
    id: "type-income"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Salary"
    direction: DOWN
- tapOn: "Salary"
- tapOn:
    id: "record-note"
- inputText: "Monthly salary"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- Food, across three sub-categories ---
