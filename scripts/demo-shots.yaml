    direction: DOWN
- tapOn: "Electricity"
- tapOn:
    id: "record-note"
- inputText: "July meter"
- hideKeyboard
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Internet"
    direction: DOWN
- tapOn: "Internet"
- tapOn:
    id: "record-note"
- inputText: "Fibre"
- hideKeyboard
- tapOn:
