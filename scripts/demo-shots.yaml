- scroll
- tapOn:
    id: "theme-option-paper"
- assertVisible:
    id: "theme-selected"
    childOf:
      id: "theme-option-paper"
- back
- back
- assertVisible:
    id: "home-screen"
- takeScreenshot: theme-paper-records
- tapOn:
    id: "tab-analysis"
- takeScreenshot: theme-paper-analysis
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-menu"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "settings-section-appearance"
# The grid is a little taller than the screen; at the foot, every
