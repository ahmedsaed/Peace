appId: com.ahmed.peace
---
# Regenerates the README screenshots from a seeded demo ledger.
#
# NOT in .maestro/, on purpose: `npm run e2e` runs that whole directory, and
# this takes several minutes while asserting almost nothing. Run `npm run shots`.
#
# It is a flow rather than a set of hand-taken captures because hand-taken
# screenshots rot. The moment a colour, a label or a layout changes, the README
# is quietly advertising an app that no longer exists — and nothing fails, so
# nobody notices. This regenerates all four in one command.
#
# THE LEDGER BELOW IS INVENTED. The repository is public and real records do not
# go in it. The amounts are chosen so the budget screen shows every state at
# once — a screenshot of four identical bars demonstrates nothing:
#
#   Food            840 + 265 + 95  = 1,200  of 2,000    60%   comfortable
#   Bills           380 + 500       =   880  of 1,000    88%   close
#   Installments    4,500           = 4,500  of 5,000    90%   close
#   Transportation  600 + 140       =   740  of   500   148%   over by 240
#   Shopping        1,200                     unbudgeted
#
# Food's 1,200 is spread across three SUB-categories, so the shot shows the
# roll-up working rather than only asserting it in a unit test.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- income first, so the month reads as a real month and not a deficit ---
- tapOn:
    id: "fab"
- tapOn:
    id: "type-income"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Salary"
    direction: DOWN
- tapOn: "Salary"
- tapOn:
    id: "record-note"
- inputText: "August salary"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- Food, across three sub-categories ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
