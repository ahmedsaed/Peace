# --- Transportation, which ends up over budget ---
# Both under Taxi. `Fuel` would have been the natural second one and is a trap:
# it is a child of CAR, not Transportation, so the 600 would have rolled up to a
# category with no budget and the over-budget row would never have appeared.
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "Airport run"
- hideKeyboard
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Taxi"
    direction: DOWN
- tapOn: "Taxi"
- tapOn:
    id: "record-note"
- inputText: "To the office"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# --- the big one, and one deliberately left unbudgeted ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
