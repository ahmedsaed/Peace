- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Weekly shop"
- hideKeyboard
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-6"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
