- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

# ===========================================================================
# 1. Records — the month at a glance
# ===========================================================================
- assertVisible:
    id: "records-list"
- assertVisible:
    id: "summary-expense"
    text: "-E£8,520.00"
- takeScreenshot: records

# ===========================================================================
# 2. Record entry — pickers, note, keypad, and the flow key
# ===========================================================================
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Groceries"
    direction: DOWN
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Seoudi, weekly"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-5"
- assertVisible:
    id: "amount-display"
    text: "425"
- takeScreenshot: record
- tapOn:
    id: "record-cancel"

# ===========================================================================
# 3. Budgets — four limits chosen to show every state at once
# ===========================================================================
- tapOn:
    id: "tab-budgets"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-food"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-food"
- inputText: "2000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-bills"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-bills"
- inputText: "1000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-installments"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-installments"
- inputText: "5000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-transport"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-transport"
- inputText: "500"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-total-budget"
    direction: UP
# The assertions that keep the screenshot honest. If the roll-up ever broke,
# Food would read 0% and this would capture a wrong screen rather than fail.
- assertVisible:
    id: "budget-percent-seed-cat-food"
    text: "60%"
- assertVisible:
    id: "budget-left-seed-cat-transport"
    text: "E£240.00 over"
- assertVisible:
    id: "budget-total-budget"
    text: "E£8,500.00"
- takeScreenshot: budgets

# ===========================================================================
# 4. Search — the filters, and the total over what was found
# ===========================================================================
# Deliberately a FILTERED result rather than a text search. Typing "Cash"
# matches all ten records, which produces a screenshot almost identical to the
# records list — a wasted tile in a six-image grid. Filtering by Food returns
# three, so the shot shows search actually narrowing something, shows the
# filter panel, and shows the parent-matches-children rule: none of these three
# records is filed under Food itself.
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-filters"
- tapOn:
    id: "filter-category"
- scrollUntilVisible:
    element:
      text: "Food"
    direction: DOWN
- tapOn: "Food"
# The search field has autoFocus, so the keyboard springs back the moment the
# picker closes and covers two of the three results. Without this the shot is a
# screenshot of a keyboard.
- hideKeyboard
- assertVisible:
    id: "search-count"
    text: "3 records"
- assertVisible:
    id: "search-expense"
    text: "-E£1,200.00"
# All three have to be on screen, or the tile shows a filter that found things
# the reader cannot see.
- assertVisible: "Groceries"
- assertVisible: "Restaurants"
- assertVisible: "Coffee"
- takeScreenshot: search
