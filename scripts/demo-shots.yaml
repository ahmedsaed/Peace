    direction: DOWN
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Weekly shop"
- hideKeyboard
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Restaurants"
    direction: DOWN
- tapOn: "Restaurants"
- tapOn:
    id: "record-note"
- inputText: "Dinner out"
- hideKeyboard
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-5"
- tapOn:
    id: "record-save"

- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- tapOn: "Coffee"
- tapOn:
    id: "record-note"
- inputText: "Flat white"
- hideKeyboard
- tapOn:
    id: "key-9"
- tapOn:
    id: "key-5"
- tapOn:
    id: "record-save"

# --- Bills ---
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- scrollUntilVisible:
