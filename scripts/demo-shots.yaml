# ===========================================================================
# 1. Records — the month at a glance
# ===========================================================================
- assertVisible:
    id: "records-list"
- assertVisible:
    id: "summary-expense"
    text: "-E£8,520.00"
- takeScreenshot: records

# ===========================================================================
# 2. Record entry — pickers, note, keypad, and the flow key
# ===========================================================================
- tapOn:
    id: "fab"
- tapOn:
    id: "pick-category"
- tapOn: "Groceries"
- tapOn:
    id: "record-note"
- inputText: "Seoudi, weekly"
- hideKeyboard
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-5"
- assertVisible:
    id: "amount-display"
    text: "425"
- takeScreenshot: record
- tapOn:
    id: "record-cancel"

# ===========================================================================
# 3. Budgets — four limits chosen to show every state at once
# ===========================================================================
- tapOn:
    id: "tab-budgets"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-food"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-food"
- inputText: "2000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-bills"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-bills"
- inputText: "1000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-installments"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-installments"
- inputText: "5000"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-row-seed-cat-transport"
    direction: DOWN
- tapOn:
    id: "budget-row-seed-cat-transport"
- inputText: "500"
- tapOn:
    id: "budget-save"

- scrollUntilVisible:
    element:
      id: "budget-total-budget"
    direction: UP
# The assertions that keep the screenshot honest. If the roll-up ever broke,
# Food would read 0% and this would capture a wrong screen rather than fail.
- assertVisible:
    id: "budget-percent-seed-cat-food"
    text: "60%"
- assertVisible:
    id: "budget-left-seed-cat-transport"
    text: "E£240.00 over"
- assertVisible:
    id: "budget-total-budget"
    text: "E£8,500.00"
- takeScreenshot: budgets

# ===========================================================================
# 4. Search — matching an account name, and totalling what it finds
# ===========================================================================
- tapOn:
    id: "tab-index"
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-input"
- inputText: "Cash"
- hideKeyboard
- assertVisible:
    id: "search-count"
    text: "10 records"
- assertVisible:
    id: "search-expense"
    text: "-E£8,520.00"
- assertVisible:
    id: "search-income"
    text: "E£18,000.00"
- takeScreenshot: search
