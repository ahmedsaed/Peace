appId: dev.merope.peace.oss
---
# Regenerates the README screenshots from a seeded demo ledger.
#
# NOT in .maestro/, on purpose: `npm run e2e` runs that whole directory, and
# this takes several minutes while asserting almost nothing. Run `npm run shots`.
#
# It is a flow rather than a set of hand-taken captures because hand-taken
# screenshots rot. The moment a colour, a label or a layout changes, the README
# is quietly advertising an app that no longer exists — and nothing fails, so
# nobody notices. This regenerates all NINE in one command.
#
# ORDER MATTERS. The first five shots assert exact totals, so everything that
# adds a record — the card purchase, the two standing orders — comes AFTER them.
# Seeding it earlier would mean recomputing four assertions by hand every time
# the demo ledger changed, which is how a flow ends up asserting nothing.
#
# THE LEDGER BELOW IS INVENTED. The repository is public and real records do not
# go in it. It is in US DOLLARS with no country's shops in it, because these
# images are the Play listing and the website as well as the README — a
# stranger should see their own kind of month, not somebody else's. The amounts
# are chosen so the budget screen shows every state at once — a screenshot of
# four identical bars demonstrates nothing:
#
#   Food            186 + 64 + 6  = 256  of 400    64%   comfortable
#   Bills           88 + 56       = 144  of 160    90%   close
#   Installments    90            =  90  of 100    90%   close
#   Transportation  42 + 18       =  60  of  50   120%   over by 10
#   Shopping        140                    unbudgeted
#
# Food's 256 is spread across three SUB-categories, so the shot shows the
# roll-up working rather than only asserting it in a unit test.
#
# Maestro matches text as a REGULAR EXPRESSION, so every `$` in an assertion is
# escaped — a bare one is an end-of-line anchor and the assertion never matches.

# 0. The welcome screen — what a first launch actually looks like.
- launchApp:
    clearState: true
    arguments:
      peace.currency: USD
      # A fresh install follows the phone, and the AVD is in light mode: without
      # this every image would be Paper. The README and the listing are Ledger;
      # the other themes are photographed on purpose at the end.
      peace.theme: ledger
- extendedWaitUntil:
    visible:
      id: "setup-welcome"
    timeout: 90000
- assertVisible: "Peace of mind. Piece of cake."
- takeScreenshot: welcome

- launchApp:
    clearState: true
    # Skip setup, and pin dollars whatever region the emulator was imaged in.
    arguments:
      peace.onboarding: done
      peace.currency: USD
      peace.theme: ledger

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000

# --- income first, so the month reads as a real month and not a deficit ---
- tapOn:
